[project]
name = "cloudscale"
version = "0.1.0"
description = "CloudScale incident remediation & auto-healing prototype (capstone)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres",
  "psycopg[binary,pool]>=3.2",
  "fastapi",
  "uvicorn[standard]",
  "mcp>=1.9",
  "redis>=5",
  "pydantic>=2.9",
  "pydantic-settings",
  "httpx",
  "tenacity>=8",
  "pyjwt[crypto]>=2.9",
  "pyyaml",
  "fastembed",
  "pgvector",
  "streamlit",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp",
  "opentelemetry-instrumentation-fastapi",
  "opentelemetry-instrumentation-httpx",
]

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudscale"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]   # FastAPI's dependency-injection idiom
