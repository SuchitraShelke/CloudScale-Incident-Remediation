# Metrics arrive by OTLP push (--web.enable-otlp-receiver); nothing to scrape.
global:
  scrape_interval: 15s
otlp:
  promote_resource_attributes: [service.name, service.namespace]
storage:
  tsdb:
    # The dev VM's clock can jump (WSL2 drift). A sample stamped in the future pushes the head forward and
    # everything after it is rejected as "too old"; a wider window absorbs small jumps. demo_prep.py resets
    # Prometheus if its newest sample is more than 5 minutes in the future.
    out_of_order_time_window: 2h
