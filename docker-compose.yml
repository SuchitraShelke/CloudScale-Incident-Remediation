# CloudScale prototype stack. See PROTOTYPE_SCOPE.md for what each service does.
# Networks enforce the trust zones: only the orchestrator can reach mcp-server and OPA.

x-app: &app
  build: .
  image: cloudscale-app:dev
  env_file:
    - path: .env
      required: false
  environment: &app-env
    POSTGRES_DSN: postgresql://cloudscale:${POSTGRES_PASSWORD:-cloudscale}@postgres:5432/cloudscale
    REDIS_URL: redis://redis:6379/0
    OPA_URL: http://opa:8181
    OLLAMA_URL: http://ollama:11434
    MCP_URL: http://mcp-server:8001/mcp
    ORCHESTRATOR_URL: http://orchestrator:8000
    OTEL_ENABLED: "true"
    OTEL_ENDPOINT: http://jaeger:4317
    OTEL_METRICS_ENDPOINT: http://prometheus:9090/api/v1/otlp/v1/metrics
    PROMETHEUS_URL: http://prometheus:9090
    HITL_PROMOTE_AFTER_S: ${HITL_PROMOTE_AFTER_S:-120}   # demo profile: 2 min (production default 10 min)
    HITL_EXPIRE_AFTER_S: ${HITL_EXPIRE_AFTER_S:-240}     # demo profile: 4 min (production default 30 min)
    BREAKER_THRESHOLD: ${BREAKER_THRESHOLD:-1}   # demo profile: one failure opens the breaker
    GUARD_TIMEOUT_S: ${GUARD_TIMEOUT_S:-20}   # LlamaGuard rarely answers on the dev VM; fail fast
    AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-audit-writer-dev}
    AUDIT_DSN: postgresql://audit_writer:${AUDIT_DB_PASSWORD:-audit-writer-dev}@postgres:5432/cloudscale
  restart: unless-stopped

services:
  orchestrator:
    <<: *app
    command: ["uvicorn", "cloudscale.orchestrator.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-env
      SERVICE_NAME: orchestrator
    ports: ["8000:8000"]
    volumes:
      - ./keys:/app/keys:ro                 # signing keypair (scripts/gen_keys.py)
      - ./mock-data:/app/mock-data:ro       # scenario files: add one and it's live, no rebuild
    networks: [edge, core, tools, data, obs]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mcp-server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/livez', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  mcp-server:
    <<: *app
    command: ["python", "-m", "cloudscale.mcp_server.main"]
    environment:
      <<: *app-env
      SERVICE_NAME: mcp-server
    volumes:
      - ./keys/signing_public.pem:/app/keys/signing_public.pem:ro   # public key only: can verify, never sign
      - ./mock-data:/app/mock-data:ro
    networks: [tools, data, obs]
    depends_on:
      redis: { condition: service_healthy }
      opa: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/livez', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  console:
    <<: *app
    command: ["streamlit", "run", "src/cloudscale/console/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    environment:
      <<: *app-env
      SERVICE_NAME: console
    ports: ["8501:8501"]
    networks: [edge]
    depends_on:
      orchestrator: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cloudscale
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudscale}
      POSTGRES_DB: cloudscale
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]   # host access for local tests only
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudscale -d cloudscale"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]   # host access for local tests only
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=info", "/policies", "/data"]
    volumes:
      - ./opa/policies:/policies:ro
      - ./opa/data:/data:ro                 # generated by scripts/gen_opa_data.py
    networks: [tools]

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: "-1"   # keep llama-guard loaded; a cold load takes minutes on this host
    volumes:
      - ollama:/root/.ollama
    networks: [core]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-init:   # one-shot model pull; needs internet on first run only (model cached in the volume)
    image: ollama/ollama:latest
    entrypoint: ["ollama", "pull", "${GUARD_MODEL:-llama-guard3:1b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks: [core]
    depends_on:
      ollama: { condition: service_healthy }
    restart: "no"

  jaeger:        # traces (OTLP gRPC :4317 in, UI :16686)
    image: jaegertracing/jaeger:latest
    ports: ["16686:16686"]
    networks: [obs]

  prometheus:    # metrics via native OTLP receiver
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-otlp-receiver",
              "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    networks: [obs]

  grafana:       # dashboards over Prometheus + Jaeger (anonymous admin: local demo only)
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cloudscale.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    networks: [obs]

networks:
  edge: {}
  core: {}
  tools: {}
  data: {}
  obs: {}

volumes:
  pgdata: {}
  ollama: {}
